function formatFileSize(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+" KB";
  if(bytes<1024*1024*1024) return (bytes/(1024*1024)).toFixed(1)+" MB";
  return (bytes/(1024*1024*1024)).toFixed(1)+" GB";
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const result=String(reader.result||"");
      const comma=result.indexOf(",");
      resolve(comma>=0?result.slice(comma+1):result);
    };
    reader.onerror=()=>reject(
      reader.error||new Error("ファイル読込に失敗しました")
    );
    reader.readAsDataURL(file);
  });
}

function quotedPrintableEncodeBytes(bytes){
  let out="";
  let lineLength=0;

  function appendToken(token){
    if(lineLength+token.length>73){
      out+="=\r\n";
      lineLength=0;
    }
    out+=token;
    lineLength+=token.length;
  }

  for(const b of bytes){
    const printable=
      (b>=33 && b<=60) ||
      (b>=62 && b<=126);

    if(printable || b===32 || b===9){
      appendToken(String.fromCharCode(b));
    }else{
      appendToken(
        "="+b.toString(16).toUpperCase().padStart(2,"0")
      );
    }
  }

  return out;
}

function quotedPrintableEncodeText(text){
  return quotedPrintableEncodeBytes(
    new TextEncoder().encode(String(text))
  );
}

function fileToQuotedPrintable(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        resolve(
          quotedPrintableEncodeBytes(
            new Uint8Array(reader.result)
          )
        );
      }catch(e){
        reject(e);
      }
    };
    reader.onerror=()=>reject(
      reader.error||new Error("ファイル読込に失敗しました")
    );
    reader.readAsArrayBuffer(file);
  });
}

function collectFileInputs(){
  return Array.from(
    $("paramsArea").querySelectorAll(
      'input.file-value[type="file"]'
    )
  );
}

function getFileParamName(input){
  const node=input.closest(".api-node");
  return node?node.dataset.nodeName:"";
}

function fileSummary(){
  return collectFileInputs()
    .map(input=>({
      name:getFileParamName(input),
      encoding:input.dataset.encoding||"none",
      files:Array.from(input.files||[]).map(file=>({
        name:file.name,
        type:file.type||"application/octet-stream",
        size:file.size
      }))
    }))
    .filter(x=>x.files.length);
}

function xmlEscape(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");
}

function valueToXml(name,value){
  if(Array.isArray(value)){
    return value.map(v=>valueToXml(name,v)).join("");
  }

  if(value===null){
    return `<${name} xsi:nil="true"/>`;
  }

  if(value && typeof value==="object" && !(value instanceof File)){
    let inner="";
    for(const [k,v] of Object.entries(value)){
      inner+=valueToXml(k,v);
    }
    return `<${name}>${inner}</${name}>`;
  }

  return `<${name}>${xmlEscape(value)}</${name}>`;
}

function paramsToXml(params,options){
  const root=(options&&options.root)||"request";
  const declaration=!options || options.declaration!==false;

  let inner="";
  for(const [k,v] of Object.entries(params)){
    inner+=valueToXml(k,v);
  }

  let xml=`<${root}>${inner}</${root}>`;

  if(declaration){
    xml='<?xml version="1.0" encoding="UTF-8"?>\n'+xml;
  }

  return xml;
}

function applyAuth(asset,headers,url){
  const auth=asset.auth||{};

  if(auth.type==="bearer"){
    const token=$("authBearer").value.trim();
    if(token){
      headers["Authorization"]="Bearer "+token;
    }
  }else if(auth.type==="apiKey"){
    const key=$("authApiKey").value.trim();

    if(key){
      const target=auth.in||"header";
      const name=auth.name||"X-API-Key";

      if(target==="query"){
        url+=(url.includes("?")?"&":"?")+
          encodeURIComponent(name)+"="+
          encodeURIComponent(key);
      }else{
        headers[name]=key;
      }
    }
  }

  return url;
}

function buildParams(options={}){
  const obj={};

  const nodes=getTopLevelParamNodes();

  for(const node of nodes){
    const r=nodeValue(node,options);
    const name=node.dataset.nodeName;

    if(r.present && name){
      obj[name]=r.value;
    }
  }

  return obj;
}

function flattenBracket(value,prefix,pairs){
  if(Array.isArray(value)){
    value.forEach((v,i)=>flattenBracket(v,`${prefix}[${i}]`,pairs));
  }else if(value!==null && typeof value==="object"){
    Object.entries(value).forEach(([k,v])=>flattenBracket(v,`${prefix}[${k}]`,pairs));
  }else{
    pairs.push([prefix,value==null?"":String(value)]);
  }
}

function buildPairs(obj,serialization){
  const pairs=[];
  if(serialization==="json-value"){
    Object.entries(obj).forEach(([k,v])=>pairs.push([k,(v!==null&&typeof v==="object")?JSON.stringify(v):String(v)]));
  }else if(serialization==="repeat"){
    Object.entries(obj).forEach(([k,v])=>{
      if(Array.isArray(v)) v.forEach(x=>pairs.push([k,(x!==null&&typeof x==="object")?JSON.stringify(x):String(x)]));
      else if(v!==null&&typeof v==="object") pairs.push([k,JSON.stringify(v)]);
      else pairs.push([k,v==null?"":String(v)]);
    });
  }else{
    Object.entries(obj).forEach(([k,v])=>flattenBracket(v,k,pairs));
  }
  return pairs;
}

function encodePairs(pairs){
  return pairs.map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
}

async function prepareRequest(){
  const asset=API_ASSETS[$("assetSelect").value];
  const params=buildParams();
  const method=(asset.method||"GET").toUpperCase();
  const paramLocation=
    asset.paramLocation||(method==="GET"?"query":"body");
  const bodyType=
    asset.bodyType||(method==="GET"?"none":"json");
  const serialization=asset.serialization||"native";
  const headers=Object.assign({},asset.headers||{});

  let url=asset.url||"";
  let body=undefined;
  let bodyPreview="";

  if(paramLocation==="query"){
    const q=encodePairs(
      buildPairs(
        params,
        serialization==="native"?"bracket":serialization
      )
    );

    if(q){
      url+=(url.includes("?")?"&":"?")+q;
    }

    bodyPreview=url;

  }else if(paramLocation==="body"){
    if(bodyType==="json" || bodyType==="xml"){
      const converted={};

      for(const [key,value] of Object.entries(params)){
        if(Array.isArray(value) && value.length && value[0] instanceof File){
          const input=collectFileInputs().find(
            x=>getFileParamName(x)===key
          );

          const encoding=
            input?(input.dataset.encoding||"none"):"none";

          if(
            encoding!=="base64" &&
            encoding!=="quoted-printable"
          ){
            throw new Error(
              `${bodyType.toUpperCase()}でfileを送信する場合は encoding に base64 または quoted-printable を指定してください。`
            );
          }

          const values=[];
          for(const file of value){
            values.push(
              encoding==="base64"
                ? await fileToBase64(file)
                : await fileToQuotedPrintable(file)
            );
          }

          converted[key]=
            input && input.multiple
              ? values
              : values[0];

        }else{
          converted[key]=value;
        }
      }

      if(bodyType==="json"){
        body=JSON.stringify(converted);
        bodyPreview=JSON.stringify(converted,null,2);

        if(!headers["Content-Type"]){
          headers["Content-Type"]=
            "application/json; charset=UTF-8";
        }
      }else{
        body=paramsToXml(converted,asset.xml||{});
        bodyPreview=body;

        if(!headers["Content-Type"]){
          headers["Content-Type"]=
            "application/xml; charset=UTF-8";
        }
      }

    }else if(bodyType==="form"){
      body=encodePairs(
        buildPairs(
          params,
          serialization==="native"?"bracket":serialization
        )
      );
      bodyPreview=body;

      if(!headers["Content-Type"]){
        headers["Content-Type"]=
          "application/x-www-form-urlencoded; charset=UTF-8";
      }

    }else if(bodyType==="multipart"){
      const form=new FormData();

      for(const [key,value] of Object.entries(params)){
        if(Array.isArray(value) && value.length && value[0] instanceof File){
          for(const file of value){
            form.append(key,file,file.name);
          }
        }else if(value!==null && typeof value==="object"){
          form.append(key,JSON.stringify(value));
        }else{
          form.append(key,value==null?"":String(value));
        }
      }

      body=form;

      // boundaryを含むContent-Typeはブラウザ側で生成する。
      delete headers["Content-Type"];

      const lines=["multipart/form-data"];
      for(const group of fileSummary()){
        for(const file of group.files){
          lines.push(
            `${group.name}: ${file.name} / ${file.type} / ${formatFileSize(file.size)}`
          );
        }
      }
      bodyPreview=lines.join("\n");

    }else if(bodyType==="binary"){
      const inputs=collectFileInputs().filter(
        x=>(x.files||[]).length>0
      );

      if(inputs.length!==1 || inputs[0].files.length!==1){
        throw new Error(
          "binary送信ではファイルを1件だけ選択してください。"
        );
      }

      const input=inputs[0];
      const file=input.files[0];
      const encoding=(input.dataset.encoding||"none").toLowerCase();

      if(encoding==="base64"){
        body=await fileToBase64(file);
        headers["Content-Type"]="text/plain; charset=UTF-8";
      }else if(encoding==="quoted-printable"){
        body=await fileToQuotedPrintable(file);
        headers["Content-Type"]="text/plain; charset=UTF-8";
        headers["Content-Transfer-Encoding"]="quoted-printable";
      }else{
        body=file;
        if(!headers["Content-Type"]){
          headers["Content-Type"]=
            file.type||"application/octet-stream";
        }
      }

      bodyPreview=[
        "binary",
        "name: "+file.name,
        "type: "+(file.type||"application/octet-stream"),
        "size: "+formatFileSize(file.size),
        "encoding: "+encoding
      ].join("\n");

    }else if(bodyType==="raw"){
      body=$("body").value;
      bodyPreview=body||"";
    }
  }

  url=applyAuth(asset,headers,url);

  return {
    asset,
    params,
    method,
    paramLocation,
    bodyType,
    serialization,
    url,
    headers,
    body,
    bodyPreview
  };
}

async function showPreview(){
  try{
    // eachRequest は「送信内容を生成」を押すたびに新しい値を作る。
    ensureSpecialValues({regenerateEachRequest:true});
    await updatePreviewFromCurrentValues();
  }catch(e){
    alert(e.message);
  }
}

async function execute(){
  let p;

  try{
    // 送信内容生成済みの eachRequest 値があれば同じ値を使用する。
    // 未生成ならAPI実行時に生成する。
    ensureSpecialValues({regenerateEachRequest:false});

    p=await prepareRequest();

    $("url").value=p.url;

    $("body").value=p.bodyPreview || "";

  }catch(e){
    $("status").textContent=
      "入力エラー: "+e.message;
    return;
  }

  if(!p.url){
    $("status").textContent=
      "アクセス先URLが未設定です";
    return;
  }

  $("execute").disabled=true;
  $("status").textContent="リクエスト中...";
  $("response").textContent="";

  const started=performance.now();

  try{
    const response=await fetch("/proxy",{
      method:"POST",
      headers:{
        "X-Proxy-Target":p.url,
        "X-Proxy-Method":p.method,
        "X-Proxy-Headers":JSON.stringify(p.headers),
        "X-Proxy-Body-Type":p.bodyType
      },
      body:p.body
    });

    const text=await response.text();

    let display=text;

    try{
      display=JSON.stringify(
        JSON.parse(text),
        null,
        2
      );
    }catch(e){}

    $("response").textContent=display;

    const historyResult=addHistory({
      assetKey:$("assetSelect").value,
      params:p.params,
      url:p.url,
      method:p.method,
      headers:p.headers,
      body:$("body").value,
      responseText:display,
      status:response.status,
      statusText:response.statusText,
      elapsedSeconds:Number(
        (
          (performance.now()-started)/1000
        ).toFixed(3)
      ),
      executedAt:new Date().toISOString()
    });

    let historyNote="";
    if(historyResult && historyResult.trimmed>0){
      historyNote=` / 履歴容量調整: 古い履歴を${historyResult.trimmed}件削除`;
    }else if(historyResult && !historyResult.ok){
      historyNote=" / 履歴保存失敗";
    }

    $("status").textContent=
      `HTTP ${response.status} ${response.statusText} / ${((performance.now()-started)/1000).toFixed(3)} 秒${historyNote}`;

  }catch(e){
    $("status").textContent=
      "通信エラー: "+e;

    $("response").textContent=
      String(e);

  }finally{
    // API実行で使用した eachRequest の値は消費済みとして破棄する。
    clearEachRequestSpecialValues();
    $("execute").disabled=false;
  }
}

function loadAsset(name){
  const asset=API_ASSETS[name];
  if(!asset) return;
  $("method").value=asset.method||"GET";
  $("bodyType").value=asset.bodyType||"none";
  $("paramLocation").value=asset.paramLocation||"";
  $("url").value=asset.url||"";
  renderHeaders(asset.headers||{});
  renderParams(asset.params||[]);
  $("body").value="";
  $("response").textContent="(未実行)";
  $("status").classList.remove("warning");
  $("status").textContent="定義読込: "+(asset.label||name);
}

function populateAssetSelect(){
  $("assetSelect").innerHTML="";
  Object.entries(API_ASSETS).forEach(([key,a])=>{
    const o=document.createElement("option");
    o.value=key; o.textContent=a.label||key;
    $("assetSelect").appendChild(o);
  });
}

async function loadAssets(){
  $("status").textContent="API定義を読み込み中...";
  const currentKey=$("assetSelect").value;

  const r=await fetch(ASSET_URL+"?t="+Date.now());
  if(!r.ok) throw new Error("api-assets.json 読込失敗: HTTP "+r.status);

  API_ASSETS=await r.json();
  populateAssetSelect();

  const storedKey=localStorage.getItem(LAST_ASSET_KEY);
  const selectedKey=
    (currentKey && API_ASSETS[currentKey] ? currentKey : "") ||
    (storedKey && API_ASSETS[storedKey] ? storedKey : "") ||
    Object.keys(API_ASSETS)[0] ||
    "";

  if(selectedKey){
    $("assetSelect").value=selectedKey;
    loadAsset(selectedKey);
  }
}


async function copyToClipboard(text,label){
  if(!text){
    $("status").textContent=label+"する内容がありません";
    return;
  }

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const area=document.createElement("textarea");
      area.value=text;
      area.style.position="fixed";
      area.style.left="-9999px";
      area.style.top="-9999px";
      document.body.appendChild(area);
      area.focus();
      area.select();

      const ok=document.execCommand("copy");
      area.remove();

      if(!ok){
        throw new Error("clipboard copy failed");
      }
    }

    $("status").textContent=label+"しました";
  }catch(e){
    $("status").textContent="コピー失敗: "+e.message;
  }
}


function escapeHtml(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function renderInlineMarkdown(text){
  let s=escapeHtml(text);

  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*]+)\*/g,"<em>$1</em>");

  return s;
}

function renderMarkdown(markdown){
  const lines=markdown.replace(/\r\n?/g,"\n").split("\n");
  let html=[];
  let inCode=false;
  let code=[];
  let listType=null;

  function closeList(){
    if(listType){
      html.push(`</${listType}>`);
      listType=null;
    }
  }

  function flushCode(){
    if(inCode){
      html.push(
        "<pre><code>"+
        escapeHtml(code.join("\n"))+
        "</code></pre>"
      );
      code=[];
      inCode=false;
    }
  }

  function splitTableRow(line){
    let s=line.trim();

    if(s.startsWith("|")){
      s=s.slice(1);
    }

    if(s.endsWith("|")){
      s=s.slice(0,-1);
    }

    return s
      .split("|")
      .map(cell=>cell.trim());
  }

  function isTableSeparator(line){
    const cells=splitTableRow(line);

    if(cells.length===0){
      return false;
    }

    return cells.every(cell=>
      /^:?-{3,}:?$/.test(cell)
    );
  }

  function renderTable(startIndex){
    const headerCells=splitTableRow(lines[startIndex]);
    let i=startIndex+2;
    const bodyRows=[];

    while(
      i<lines.length &&
      lines[i].includes("|") &&
      lines[i].trim()!==""
    ){
      bodyRows.push(
        splitTableRow(lines[i])
      );
      i++;
    }

    const parts=[];
    parts.push("<table>");
    parts.push("<thead><tr>");

    headerCells.forEach(cell=>{
      parts.push(
        "<th>"+
        renderInlineMarkdown(cell)+
        "</th>"
      );
    });

    parts.push("</tr></thead>");

    if(bodyRows.length){
      parts.push("<tbody>");

      bodyRows.forEach(row=>{
        parts.push("<tr>");

        for(let c=0;c<headerCells.length;c++){
          const value=
            c<row.length
              ? row[c]
              : "";

          parts.push(
            "<td>"+
            renderInlineMarkdown(value)+
            "</td>"
          );
        }

        parts.push("</tr>");
      });

      parts.push("</tbody>");
    }

    parts.push("</table>");

    return {
      html:parts.join(""),
      nextIndex:i
    };
  }

  for(let i=0;i<lines.length;i++){
    const line=lines[i];

    if(line.startsWith("```")){
      closeList();

      if(inCode){
        flushCode();
      }else{
        inCode=true;
        code=[];
      }

      continue;
    }

    if(inCode){
      code.push(line);
      continue;
    }

    // Markdown table:
    // | A | B |
    // |---|---|
    // | 1 | 2 |
    if(
      line.includes("|") &&
      i+1<lines.length &&
      isTableSeparator(lines[i+1])
    ){
      closeList();

      const table=renderTable(i);
      html.push(table.html);

      i=table.nextIndex-1;
      continue;
    }

    let m;

    if((m=line.match(/^(#{1,6})\s+(.*)$/))){
      closeList();
      const level=m[1].length;

      html.push(
        `<h${level}>${renderInlineMarkdown(m[2])}</h${level}>`
      );

      continue;
    }

    if((m=line.match(/^\s*[-*]\s+(.*)$/))){
      if(listType!=="ul"){
        closeList();
        listType="ul";
        html.push("<ul>");
      }

      html.push(
        `<li>${renderInlineMarkdown(m[1])}</li>`
      );

      continue;
    }

    if((m=line.match(/^\s*\d+\.\s+(.*)$/))){
      if(listType!=="ol"){
        closeList();
        listType="ol";
        html.push("<ol>");
      }

      html.push(
        `<li>${renderInlineMarkdown(m[1])}</li>`
      );

      continue;
    }

    if((m=line.match(/^>\s?(.*)$/))){
      closeList();

      html.push(
        `<blockquote>${renderInlineMarkdown(m[1])}</blockquote>`
      );

      continue;
    }

    if(/^\s*$/.test(line)){
      closeList();
      html.push("");
      continue;
    }

    closeList();

    html.push(
      `<p>${renderInlineMarkdown(line)}</p>`
    );
  }

  closeList();
  flushCode();

  return html.join("\n");
}

let readmeLastFocusedElement=null;

async function openReadme(){
  readmeLastFocusedElement=document.activeElement;

  $("readmeModal").classList.add("open");
  $("readmeModal").setAttribute("aria-hidden","false");
  $("readmeContent").textContent="読み込み中...";

  requestAnimationFrame(()=>$("closeReadme").focus());

  try{
    const response=await fetch("/readme?t="+Date.now());

    if(!response.ok){
      throw new Error(
        "README.md 読込失敗: HTTP "+response.status
      );
    }

    const markdown=await response.text();
    $("readmeContent").innerHTML=renderMarkdown(markdown);

  }catch(e){
    $("readmeContent").textContent=
      "README読込エラー: "+e.message;
  }
}

function closeReadme(){
  const modal=$("readmeModal");

  if(document.activeElement && modal.contains(document.activeElement)){
    document.activeElement.blur();
  }

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");

  if(readmeLastFocusedElement && document.contains(readmeLastFocusedElement)){
    readmeLastFocusedElement.focus();
  }

  readmeLastFocusedElement=null;
}

$("readmeButton").onclick=openReadme;
$("closeReadme").onclick=closeReadme;

$("readmeModal").onclick=e=>{
  if(e.target===$("readmeModal")){
    closeReadme();
  }
};

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeReadme();
  }
});


const STORAGE_KEY="generic-api-tester.saved-requests.v1";

function isQuotaExceededError(error){
  return !!error && (
    error.name==="QuotaExceededError" ||
    error.name==="NS_ERROR_DOM_QUOTA_REACHED" ||
    error.code===22 ||
    error.code===1014
  );
}

function trySetLocalStorage(key,value){
  try{
    localStorage.setItem(key,value);
    return {ok:true,quota:false,error:null};
  }catch(error){
    return {
      ok:false,
      quota:isQuotaExceededError(error),
      error:error
    };
  }
}

function getSavedRequests(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return {};
    const obj=JSON.parse(raw);
    return obj && typeof obj==="object" ? obj : {};
  }catch(e){
    return {};
  }
}

function setSavedRequests(obj){
  return trySetLocalStorage(
    STORAGE_KEY,
    JSON.stringify(obj)
  );
}

function refreshSavedRequests(selectedName=""){
  const saved=getSavedRequests();
  const select=$("savedRequests");
  select.innerHTML="";

  const empty=document.createElement("option");
  empty.value="";
  empty.textContent="保存データを選択";
  select.appendChild(empty);

  Object.keys(saved)
    .sort((a,b)=>a.localeCompare(b,"ja"))
    .forEach(name=>{
      const option=document.createElement("option");
      option.value=name;
      option.textContent=name;
      select.appendChild(option);
    });

  if(selectedName && saved[selectedName]){
    select.value=selectedName;
  }
}

function setNodeFromValue(node,value){
  const type=node.dataset.nodeType;

  if(type==="value"){
    const input=node.querySelector(":scope .node-value");
    if(!input) return;

    const valueType=(node.dataset.valueType||"").toLowerCase();
    const inputType=(node.dataset.inputType||"").toLowerCase();

    if(valueType==="boolean"){
      if(typeof input._applyBooleanState==="function"){
        if(value===null || typeof value==="undefined"){
          input._applyBooleanState("unset");
        }else{
          input._applyBooleanState(value===true ? "true" : "false");
        }
      }
      return;
    }

    if(input.dataset.special && (input.dataset.specialRegenerate||"ifEmpty").toLowerCase()==="eachrequest"){
      input._specialPendingValue=null;
      return;
    }

    if(inputType==="select"){
      let matched=false;
      for(const option of input.options){
        if(option.dataset.unset==="true") continue;
        if(sameChoiceValue(decodeChoiceValue(option.value),value)){
          option.selected=true;
          matched=true;
          break;
        }
      }
      if(!matched) input.value="";
      return;
    }

    if(inputType==="radio"){
      for(const radio of input.querySelectorAll('input[type="radio"]')){
        radio.checked=sameChoiceValue(decodeChoiceValue(radio.value),value);
      }
      return;
    }

    input.value=value==null?"":String(value);
    return;
  }

  if(type==="object"){
    const children=node.querySelector(
      ":scope > .param-group > .object-children"
    );
    const source=(value && typeof value==="object" && !Array.isArray(value))
      ? value
      : {};

    for(const child of children.children){
      if(!child.classList.contains("api-node")) continue;
      const name=child.dataset.nodeName;

      if(Object.prototype.hasOwnProperty.call(source,name)){
        setNodeFromValue(child,source[name]);
      }else{
        resetNodeToUnset(child);
      }
    }
    return;
  }

  if(type==="array"){
    const itemsContainer=node.querySelector(
      ":scope > .param-group > .array-items"
    );

    itemsContainer.innerHTML="";

    if(!Array.isArray(value)){
      renumberArray(node);
      return;
    }

    value.forEach(itemValue=>{
      addArrayItem(node);
      const items=node.querySelectorAll(
        ":scope > .param-group > .array-items > .array-item"
      );
      const item=items[items.length-1];
      const child=item.querySelector(":scope > .api-node");
      setNodeFromValue(child,itemValue);
    });

    renumberArray(node);
  }
}

function getTopLevelParamNodes(){
  const nodes=[];

  for(const child of $("paramsArea").children){
    if(child.classList.contains("api-node")){
      nodes.push(child);
    }else if(child.classList.contains("top-boolean-inline")){
      for(const node of child.children){
        if(node.classList.contains("api-node")) nodes.push(node);
      }
    }
  }

  return nodes;
}

function resetNodeToUnset(node){
  const type=node.dataset.nodeType;

  if(type==="value"){
    const input=node.querySelector(":scope .node-value");
    if(!input) return;

    const valueType=(node.dataset.valueType||"").toLowerCase();
    const inputType=(node.dataset.inputType||"").toLowerCase();

    if(valueType==="boolean"){
      if(typeof input._applyBooleanState==="function"){
        input._applyBooleanState("unset");
      }
      return;
    }

    if(input.dataset.special){
      input._specialPendingValue=null;
    }

    if(valueType==="file"){
      input.value="";
      const meta=node.querySelector(".file-meta");
      if(meta) meta.textContent="未選択";
      return;
    }

    if(inputType==="select"){
      const unsetOption=Array.from(input.options).find(
        option=>option.dataset.unset==="true"
      );
      if(unsetOption){
        input.value=unsetOption.value;
      }else{
        input.selectedIndex=-1;
      }
      return;
    }

    if(inputType==="radio"){
      for(const radio of input.querySelectorAll('input[type="radio"]')){
        radio.checked=false;
      }
      return;
    }

    input.value="";
    return;
  }

  if(type==="object"){
    const children=node.querySelector(
      ":scope > .param-group > .object-children"
    );
    if(!children) return;

    for(const child of children.children){
      if(child.classList.contains("api-node")){
        resetNodeToUnset(child);
      }
    }
    return;
  }

  if(type==="array"){
    const itemsContainer=node.querySelector(
      ":scope > .param-group > .array-items"
    );
    if(itemsContainer){
      itemsContainer.innerHTML="";
    }
    renumberArray(node);
  }
}

function compareLoadedParamsWithAsset(assetParams, loadedParams){
  const missingInAsset=[];
  const missingInLoaded=[];

  function enabledDefs(defs){
    return (Array.isArray(defs)?defs:[]).filter(d=>d && d.enabled!==false && d.name);
  }

  function compareDefs(defs, data, prefix=""){
    const obj=(data && typeof data==="object" && !Array.isArray(data)) ? data : {};
    const active=enabledDefs(defs);
    const byName=new Map(active.map(d=>[d.name,d]));

    for(const key of Object.keys(obj)){
      if(!byName.has(key)) missingInAsset.push(prefix+key);
    }

    for(const def of active){
      const path=prefix+def.name;
      if(!Object.prototype.hasOwnProperty.call(obj,def.name)){
        // 任意項目は送信時に省略されるため、履歴に存在しなくても差異扱いしない。
        // required:true の項目が欠けている場合だけ警告対象とする。
        if(def.required===true){
          missingInLoaded.push(path);
        }
        continue;
      }
      const value=obj[def.name];
      if(def.type==="object"){
        compareDefs(def.children||[],value,path+".");
      }else if(def.type==="array" && Array.isArray(value)){
        const item=def.item||{};
        if(item.type==="object"){
          value.forEach((v,i)=>compareDefs(item.children||[],v,`${path}[${i}].`));
        }
      }
    }
  }

  compareDefs(assetParams||[],loadedParams||{});
  return {missingInAsset,missingInLoaded};
}

function formatAssetDifferenceWarning(diff){
  const lines=[];
  if(diff.missingInAsset.length){
    lines.push("現在のAPI定義に存在しない保存項目:");
    diff.missingInAsset.forEach(x=>lines.push("・"+x));
  }
  if(diff.missingInLoaded.length){
    if(lines.length) lines.push("");
    lines.push("保存データに存在しないAPI定義項目:");
    diff.missingInLoaded.forEach(x=>lines.push("・"+x));
  }
  if(!lines.length) return "";
  return "⚠ 保存データと現在のAPI定義に差異があります。\n"+
    lines.join("\n")+"\n\n読み込み可能な項目のみ復元しました。";
}

function showLoadResult(message, assetKey, params){
  const asset=API_ASSETS[assetKey];
  const diff=compareLoadedParamsWithAsset(asset?.params||[],params||{});
  const warning=formatAssetDifferenceWarning(diff);
  const status=$("status");
  status.classList.toggle("warning",Boolean(warning));
  status.textContent=warning ? message+"\n\n"+warning : message;
}

function applyParamsToScreen(params){
  const source=(params && typeof params==="object") ? params : {};

  for(const node of getTopLevelParamNodes()){
    const name=node.dataset.nodeName;

    if(Object.prototype.hasOwnProperty.call(source,name)){
      setNodeFromValue(node,source[name]);
    }else{
      // 保存JSON/履歴/インポートにキーが無い項目は「未指定」。
      // API定義の default を再適用しない。
      resetNodeToUnset(node);
    }
  }
}


function pad2(value){
  return String(value).padStart(2,"0");
}

function makeDefaultSaveName(){
  const now=new Date();

  const base=
    "request_"+
    now.getFullYear()+
    pad2(now.getMonth()+1)+
    pad2(now.getDate())+
    "_"+
    pad2(now.getHours())+
    pad2(now.getMinutes())+
    pad2(now.getSeconds());

  const saved=getSavedRequests();

  if(!saved[base]){
    return base;
  }

  let index=2;

  while(saved[base+"_"+index]){
    index++;
  }

  return base+"_"+index;
}


let confirmResolver=null;
let confirmLastFocusedElement=null;

function showConfirmModal(message,title="確認",okLabel="OK"){
  confirmLastFocusedElement=document.activeElement;

  $("confirmTitle").textContent=title;
  $("confirmMessage").textContent=message;
  $("confirmOk").textContent=okLabel;

  $("confirmModal").classList.add("open");
  $("confirmModal").setAttribute("aria-hidden","false");

  requestAnimationFrame(()=>$("confirmOk").focus());

  return new Promise(resolve=>{
    confirmResolver=resolve;
  });
}

function closeConfirmModal(result){
  const modal=$("confirmModal");

  if(document.activeElement && modal.contains(document.activeElement)){
    document.activeElement.blur();
  }

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");

  if(confirmLastFocusedElement && document.contains(confirmLastFocusedElement)){
    confirmLastFocusedElement.focus();
  }

  confirmLastFocusedElement=null;

  if(confirmResolver){
    const resolve=confirmResolver;
    confirmResolver=null;
    resolve(result);
  }
}

$("confirmOk").onclick=()=>closeConfirmModal(true);
$("confirmCancel").onclick=()=>closeConfirmModal(false);

$("confirmModal").onclick=e=>{
  if(e.target===$("confirmModal")){
    closeConfirmModal(false);
  }
};

document.addEventListener("keydown",e=>{
  if(
    e.key==="Escape" &&
    $("confirmModal").classList.contains("open")
  ){
    closeConfirmModal(false);
  }
});

async function saveCurrentRequest(){
  let name=$("saveName").value.trim();
  let autoGenerated=false;

  if(!name){
    name=makeDefaultSaveName();
    $("saveName").value=name;
    autoGenerated=true;
  }

  const existing=getSavedRequests();

  if(
    !autoGenerated &&
    Object.prototype.hasOwnProperty.call(existing,name)
  ){
    const overwrite=await showConfirmModal(
      "保存名「"+name+"」は既に存在します。上書きしますか？",
      "上書き確認",
      "上書き"
    );

    if(!overwrite){
      $("status").textContent=
        "保存をキャンセルしました";
      return;
    }
  }

  let params;

  try{
    params=buildParams({generateSpecial:false});
  }catch(e){
    $("status").textContent="保存できません: "+e.message;
    return;
  }

  const assetKey=$("assetSelect").value;
  const saved=getSavedRequests();

  saved[name]={
    assetKey:assetKey,
    params:params,
    body:$("body").value,
    savedAt:new Date().toISOString()
  };

  const saveResult=setSavedRequests(saved);

  if(!saveResult.ok){
    $("status").textContent=saveResult.quota
      ? "保存できません: localStorage の保存容量が不足しています。不要な保存データや実行履歴を削除してください。"
      : "保存できません: "+saveResult.error;
    return;
  }

  refreshSavedRequests(name);
  $("status").textContent="保存しました: "+name;
}

function loadSavedRequest(){
  const name=$("savedRequests").value;

  if(!name){
    $("status").textContent="読み込む保存データを選択してください";
    return;
  }

  const saved=getSavedRequests();
  const item=saved[name];

  if(!item){
    $("status").textContent="保存データが見つかりません";
    refreshSavedRequests();
    return;
  }

  if(!API_ASSETS[item.assetKey]){
    $("status").textContent=
      "保存時のAPI定義が現在存在しません: "+item.assetKey;
    return;
  }

  $("assetSelect").value=item.assetKey;
  loadAsset(item.assetKey);
  applyParamsToScreen(item.params||{});
  $("body").value=item.body||"";
  $("saveName").value=name;

  showLoadResult("読み込みました: "+name,item.assetKey,item.params||{});
}

async function deleteSavedRequest(){
  const name=$("savedRequests").value;

  if(!name){
    $("status").textContent="削除する保存データを選択してください";
    return;
  }

  const saved=getSavedRequests();

  if(!saved[name]){
    refreshSavedRequests();
    return;
  }

  const confirmed=await showConfirmModal(
    "保存データ「"+name+"」を削除しますか？",
    "保存データ削除",
    "削除"
  );

  if(!confirmed){
    $("status").textContent=
      "削除をキャンセルしました";
    return;
  }

  delete saved[name];
  const deleteResult=setSavedRequests(saved);
  if(!deleteResult.ok){
    $("status").textContent="保存データの削除結果を保存できません: "+deleteResult.error;
    return;
  }
  refreshSavedRequests();

  if($("saveName").value===name){
    $("saveName").value="";
  }

  $("status").textContent="削除しました: "+name;
}


function buildSavePayload(name=""){
  const assetKey=$("assetSelect").value;

  return {
    format:"generic-api-tester-request",
    version:1,
    name:name || $("saveName").value.trim() || "request",
    assetKey:assetKey,
    params:buildParams({generateSpecial:false}),
    body:$("body").value,
    savedAt:new Date().toISOString()
  };
}

function sanitizeFileName(name){
  return String(name || "request")
    .replace(/[\\/:*?"<>|]/g,"_")
    .replace(/\s+/g,"_")
    .replace(/^_+|_+$/g,"") || "request";
}

function exportCurrentRequest(){
  let payload;

  try{
    payload=buildSavePayload();
  }catch(e){
    $("status").textContent=
      "ファイル保存できません: "+e.message;
    return;
  }

  const json=JSON.stringify(payload,null,2);
  const blob=new Blob(
    [json],
    {type:"application/json;charset=UTF-8"}
  );

  const url=URL.createObjectURL(blob);
  const anchor=document.createElement("a");

  anchor.href=url;
  anchor.download=
    sanitizeFileName(payload.name)+".json";

  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    0
  );

  $("status").textContent=
    "ファイル保存しました: "+anchor.download;
}

function validateImportedPayload(payload){
  if(!payload || typeof payload!=="object"){
    throw new Error("JSONオブジェクトではありません");
  }

  if(payload.format!=="generic-api-tester-request"){
    throw new Error("このAPIテスターの保存ファイルではありません");
  }

  if(payload.version!==1){
    throw new Error(
      "未対応の保存ファイルバージョンです: "+
      payload.version
    );
  }

  if(!payload.assetKey){
    throw new Error("assetKey がありません");
  }

  return payload;
}

function applyImportedPayload(payload){
  validateImportedPayload(payload);

  if(!API_ASSETS[payload.assetKey]){
    throw new Error(
      "保存時のAPI定義が現在存在しません: "+
      payload.assetKey
    );
  }

  $("assetSelect").value=
    payload.assetKey;

  loadAsset(
    payload.assetKey
  );

  applyParamsToScreen(
    payload.params || {}
  );

  $("body").value=
    payload.body || "";

  $("saveName").value=
    payload.name || "";

  showLoadResult(
    "ファイルから読み込みました: "+(payload.name || payload.assetKey),
    payload.assetKey,
    payload.params || {}
  );
}

async function importRequestFile(file){
  if(!file){
    return;
  }

  try{
    const text=await file.text();
    const payload=JSON.parse(text);

    applyImportedPayload(
      payload
    );
  }catch(e){
    $("status").textContent=
      "ファイル読込エラー: "+e.message;
  }
}


const HISTORY_STORAGE_KEY="generic-api-tester.history.v1";
const HISTORY_LIMIT=10;

function getHistory(){
  try{
    const raw=localStorage.getItem(HISTORY_STORAGE_KEY);
    if(!raw) return [];
    const arr=JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){
    return [];
  }
}

function setHistory(items){
  const working=items.slice(0,HISTORY_LIMIT);
  let trimmed=0;

  while(true){
    const result=trySetLocalStorage(
      HISTORY_STORAGE_KEY,
      JSON.stringify(working)
    );

    if(result.ok){
      return {ok:true,trimmed:trimmed,storedCount:working.length};
    }

    if(!result.quota){
      return {ok:false,trimmed:trimmed,storedCount:0,error:result.error};
    }

    if(working.length<=1){
      // 新しい履歴1件だけでも入らない場合は既存履歴を壊さず保存失敗とする。
      return {ok:false,trimmed:trimmed,storedCount:0,error:result.error,quota:true};
    }

    // 容量不足時は最も古い履歴から削除して再試行する。
    working.pop();
    trimmed++;
  }
}


function formatHistoryLabel(item,index){
  const dt=new Date(item.executedAt);
  const dateText=
    Number.isNaN(dt.getTime())
      ? item.executedAt
      : dt.toLocaleString();

  const asset=
    API_ASSETS[item.assetKey];

  const label=
    asset
      ? (asset.label || item.assetKey)
      : item.assetKey;

  return `${index+1}. ${dateText} / ${label} / HTTP ${item.status}`;
}

function refreshHistory(){
  const select=$("historySelect");
  select.innerHTML="";

  const empty=document.createElement("option");
  empty.value="";
  empty.textContent="実行履歴を選択";
  select.appendChild(empty);

  const history=getHistory();

  history.forEach((item,index)=>{
    const option=document.createElement("option");
    option.value=String(index);
    option.textContent=formatHistoryLabel(item,index);
    select.appendChild(option);
  });
}

function addHistory(entry){
  const history=getHistory();
  history.unshift(entry);

  const result=setHistory(history);
  refreshHistory();

  return result;
}


function loadHistoryEntry(){
  const index=Number($("historySelect").value);

  if(!Number.isInteger(index)){
    $("status").textContent=
      "読み込む履歴を選択してください";
    return;
  }

  const history=getHistory();
  const item=history[index];

  if(!item){
    $("status").textContent=
      "履歴が見つかりません";
    refreshHistory();
    return;
  }

  if(!API_ASSETS[item.assetKey]){
    $("status").textContent=
      "履歴のAPI定義が現在存在しません: "+
      item.assetKey;
    return;
  }

  $("assetSelect").value=
    item.assetKey;

  loadAsset(
    item.assetKey
  );

  applyParamsToScreen(
    item.params || {}
  );

  $("body").value=
    item.body || "";

  $("response").textContent=
    item.responseText || "";

  showLoadResult(
    "履歴を読み込みました: HTTP "+item.status+" / "+item.executedAt,
    item.assetKey,
    item.params || {}
  );
}


async function deleteSelectedHistoryEntry(){
  const value=$("historySelect").value;

  if(value===""){
    $("status").textContent=
      "削除する履歴を選択してください";
    return;
  }

  const index=Number(value);

  if(!Number.isInteger(index)){
    $("status").textContent=
      "履歴の選択が不正です";
    return;
  }

  const history=getHistory();

  if(index<0 || index>=history.length){
    $("status").textContent=
      "履歴が見つかりません";
    refreshHistory();
    return;
  }

  const removed=history.splice(index,1)[0];

  setHistory(history);
  refreshHistory();

  $("status").textContent=
    "履歴を1件削除しました: "+
    (
      removed && removed.executedAt
        ? removed.executedAt
        : ""
    );
}

async function clearHistoryEntries(){
  const history=getHistory();

  if(history.length===0){
    $("status").textContent=
      "削除する実行履歴がありません";
    return;
  }

  const confirmed=await showConfirmModal(
    "保存されている実行履歴をすべて削除しますか？",
    "履歴全削除",
    "全削除"
  );

  if(!confirmed){
    $("status").textContent=
      "履歴全削除をキャンセルしました";
    return;
  }

  localStorage.removeItem(
    HISTORY_STORAGE_KEY
  );

  refreshHistory();

  $("status").textContent=
    "実行履歴をすべて削除しました";
}
