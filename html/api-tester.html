<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generic API Tester</title>

<style>
:root{
  --bg:#f3f5f8;
  --panel:#fff;
  --line:#d8dde5;
  --muted:#66707d;
  --primary:#1f6feb;
  --code:#111827;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:"Segoe UI","Yu Gothic UI",sans-serif;
  background:var(--bg);
  color:#222;
}
.app{max-width:1500px;margin:auto}
.topbar{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.toolbar{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:14px;
}

.toolbar-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.toolbar-row-primary .asset-group{
  margin-left:auto;
}

.title-group{
  display:flex;
  align-items:center;
  gap:10px;
}

.topbar h1{
  font-size:22px;
  margin:0;
}

.asset-group{
  display:flex;
  align-items:center;
  gap:8px;
}

#assetSelect{
  width:260px;
  min-width:220px;
  max-width:320px;
}

#reloadAssets{
  white-space:nowrap;
}

#readmeButton{
  white-space:nowrap;
}
.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;
  align-items:start;
}
.tile{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  padding:14px;
  min-width:0;
}
.tile h2{font-size:16px;margin:0 0 12px}
.row{
  display:grid;
  grid-template-columns:145px minmax(0,1fr);
  gap:8px;
  align-items:center;
  margin-bottom:9px;
}
input,select,textarea{
  width:100%;
  padding:7px 8px;
  border:1px solid #b8c0cb;
  border-radius:4px;
  background:#fff;
}
textarea{
  min-height:120px;
  resize:vertical;
  font:13px Consolas,monospace;
}
button{
  padding:7px 12px;
  border:1px solid #9da6b2;
  border-radius:4px;
  background:#fff;
  cursor:pointer;
}
button.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}
button:disabled{opacity:.55;cursor:default}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.param-group{
  border:1px solid #e1e5ea;
  border-radius:6px;
  padding:10px;
  margin-bottom:8px;
}
.param-group-title{
  font-weight:700;
  margin-bottom:8px;
}
.param-group .param-group{
  margin-left:18px;
  background:#fafbfc;
}
.param-leaf{
  display:grid;
  grid-template-columns:180px minmax(0,1fr);
  gap:8px;
  align-items:center;
  margin-bottom:7px;
}
.param-leaf:last-child{margin-bottom:0}
.status{
  padding:9px 10px;
  background:#eef1f5;
  border-radius:5px;
  font:13px Consolas,monospace;
  white-space:pre-wrap;
}
.status.warning{
  background:#fff7d6;
  border:1px solid #d6a700;
}
pre{
  margin:0;
  background:var(--code);
  color:#e5e7eb;
  padding:12px;
  border-radius:6px;
  min-height:210px;
  max-height:460px;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-word;
  font:13px Consolas,monospace;
}
details{
  border-top:1px solid var(--line);
  margin-top:12px;
  padding-top:8px;
}
summary{
  cursor:pointer;
  font-weight:600;
  color:#39424e;
  user-select:none;
}
.header-table{
  width:100%;
  border-collapse:collapse;
}
.header-table th,
.header-table td{
  border-bottom:1px solid #e5e8ed;
  padding:5px;
  text-align:left;
}
.small{font-size:12px;color:var(--muted)}
.badge{
  display:inline-block;
  font-size:11px;
  padding:2px 6px;
  border-radius:999px;
  background:#eef1f5;
  margin-left:5px;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  z-index:1000;
}
.modal-backdrop.open{
  display:flex;
}
.modal{
  width:min(1100px,96vw);
  max-height:90vh;
  background:#fff;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.modal-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
}
.modal-header h2{
  margin:0;
  font-size:17px;
  flex:1;
}
.modal-body{
  padding:18px;
  overflow:auto;
  line-height:1.65;
}
.modal-body h1,
.modal-body h2,
.modal-body h3{
  margin-top:1.4em;
}
.modal-body h1:first-child,
.modal-body h2:first-child,
.modal-body h3:first-child{
  margin-top:0;
}
.modal-body pre{
  min-height:0;
  max-height:none;
  white-space:pre;
}
.modal-body code{
  font-family:Consolas,monospace;
  background:#eef1f5;
  padding:1px 4px;
  border-radius:3px;
}
.modal-body pre code{
  background:transparent;
  padding:0;
}
.modal-body table{
  width:100%;
  border-collapse:collapse;
  margin:12px 0;
}
.modal-body th,
.modal-body td{
  border:1px solid #d8dde5;
  padding:6px 8px;
  text-align:left;
}
.modal-body blockquote{
  margin:12px 0;
  padding:8px 12px;
  border-left:4px solid #ccd3dd;
  background:#f7f8fa;
}


.full-width{
  grid-column:1 / -1;
}

.detail-bar{
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;
}

.compact-detail{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  min-width:0;
}

.compact-detail > summary{
  padding:11px 14px;
  list-style-position:inside;
}

.compact-detail[open] > summary{
  border-bottom:1px solid var(--line);
}

.compact-detail-content{
  padding:14px;
}

.compact-detail .header-table{
  margin-top:0;
}

.output-tile{
  min-height:0;
}

.output-tile textarea,
.output-tile pre{
  min-height:260px;
  height:calc(100vh - 570px);
  max-height:520px;
}

.output-tile textarea{
  resize:vertical;
}


.main-layout{
  display:grid;
  grid-template-columns:minmax(340px,0.8fr) minmax(520px,1.2fr);
  gap:14px;
  align-items:start;
}

.params-tile{
  min-width:0;
}

.params-tile #paramsArea{
  max-height:220px;
}

.params-tile .param-leaf{
  grid-template-columns:150px minmax(0,1fr);
  gap:6px;
  margin-bottom:5px;
}

.params-tile .param-group{
  padding:8px;
  margin-bottom:6px;
}

.params-tile .param-group-title{
  margin-bottom:5px;
}

.params-tile input,
.params-tile textarea{
  padding:5px 7px;
}

.special-value-control{
  display:flex;
  gap:6px;
  align-items:center;
  min-width:0;
}

.special-value-control .node-value{
  flex:1 1 auto;
  min-width:0;
}

.special-value-control .special-regenerate{
  flex:0 0 auto;
  white-space:nowrap;
}

.choice-select{
  width:100%;
  min-width:0;
  padding:5px 7px;
}

.radio-options{
  display:flex;
  flex-wrap:wrap;
  gap:6px 14px;
  align-items:center;
}

.radio-option{
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
  cursor:pointer;
}

.radio-option input[type="radio"]{
  width:auto !important;
  min-width:0;
  margin:0;
}

.special-auto-display{
  font-style:italic;
}

.send-tile textarea{
  min-height:220px;
  height:220px;
}

.details-row{
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;
}

.response-tile{
  grid-column:1 / -1;
}

.response-tile pre{
  min-height:340px;
  max-height:620px;
}

@media(max-width:1000px){
  .main-layout{
    grid-template-columns:1fr;
  }

  .details-row{
    grid-template-columns:1fr;
  }

  .response-tile{
    grid-column:auto;
  }
}

@media(max-width:900px){
  .detail-bar{
    grid-template-columns:1fr;
  }

  .output-tile textarea,
  .output-tile pre{
    height:auto;
    min-height:220px;
  }
}


#paramsArea .api-node{
  margin-bottom:6px;
}

#paramsArea .node-row{
  gap:6px;
}

#paramsArea .node-children{
  margin-top:6px;
}

#paramsArea{
  overflow:auto;
  padding-right:4px;
}

#paramsArea.has-params{
  height:auto;
  min-height:0;
  max-height:250px;
  overflow:auto;
}

#paramsArea.no-params{
  height:auto;
  min-height:0;
  max-height:none;
  overflow:visible;
}

@media(max-width:900px){
  body{padding:10px}
  .grid{grid-template-columns:1fr}
}

.two-column-layout{
  display:grid;
  grid-template-columns:minmax(380px,40%) minmax(0,60%);
  gap:14px;
  align-items:start;
}

.left-column,
.right-column{
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
}

.left-column .params-tile #paramsArea{
  max-height:250px;
}

.left-column .compact-detail{
  width:100%;
}

.right-column .send-tile textarea{
  min-height:140px;
  height:150px;
}

.right-column .response-tile pre{
  min-height:420px;
  max-height:650px;
}

@media(max-width:1000px){
  .two-column-layout{
    grid-template-columns:1fr;
  }
}


.required-mark{margin-left:4px;font-weight:700}
.boolean-control{display:inline-flex;align-items:center;gap:6px;min-height:30px;cursor:pointer;user-select:none}
.boolean-control input[type="checkbox"]{width:auto;margin:0}
.boolean-state{min-width:42px;font-size:12px;opacity:.75}
.inline-layout > .object-children{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.inline-layout > .object-children > .api-node{flex:0 0 auto;min-width:0}
.inline-layout > .object-children > .api-node > .param-leaf{display:flex;grid-template-columns:none;align-items:center;gap:6px;margin:0}
.inline-layout > .object-children > .api-node > .param-leaf > label{display:none}

.boolean-row{
  align-items:center;
}

.boolean-control{
  display:inline-flex !important;
  align-items:center;
  gap:6px;
  min-height:28px;
  cursor:pointer;
  user-select:none;
  padding:2px 4px;
  border-radius:4px;
}

.boolean-control input[type="checkbox"]{
  display:inline-block !important;
  appearance:auto;
  -webkit-appearance:checkbox;
  width:16px !important;
  height:16px !important;
  min-width:16px;
  margin:0;
  padding:0;
  flex:0 0 auto;
  pointer-events:none;
}

.boolean-caption{
  white-space:nowrap;
}


.file-control{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.file-control input[type="file"]{
  min-width:0;
  max-width:100%;
}
.file-meta{
  font-size:12px;
  opacity:.75;
}
.auth-panel{
  display:grid;
  gap:8px;
}
.auth-row{
  display:grid;
  grid-template-columns:120px minmax(0,1fr);
  gap:8px;
  align-items:center;
}

.inline-layout > .object-children{
  display:flex !important;
  flex-wrap:wrap !important;
  gap:6px 14px !important;
  align-items:flex-start;
  width:100%;
  min-width:0;
}

.inline-layout > .object-children > .api-node{
  flex:0 0 auto !important;
  width:auto !important;
  max-width:100%;
  min-width:0;
  margin:0;
}

.inline-layout > .object-children > .api-node > .param-leaf,
.inline-layout > .object-children > .api-node > .boolean-row{
  display:block !important;
  width:auto !important;
  min-width:0;
  margin:0 !important;
}

.inline-layout .boolean-control{
  display:inline-flex !important;
  width:auto !important;
  max-width:100%;
  flex:0 0 auto;
  white-space:nowrap;
}

.inline-layout .boolean-caption,
.inline-layout .boolean-state{
  white-space:nowrap;
}

@media(max-width:700px){
  .inline-layout > .object-children{
    gap:6px 10px !important;
  }

  .inline-layout .boolean-control{
    white-space:normal;
  }
}


.top-boolean-inline{
  display:flex;
  flex-wrap:wrap;
  gap:6px 14px;
  align-items:center;
  width:100%;
  min-width:0;
  margin:2px 0 6px;
}

.top-boolean-inline > .api-node{
  flex:0 0 auto;
  width:auto;
  min-width:0;
  margin:0;
}

.top-boolean-inline > .api-node > .param-leaf,
.top-boolean-inline > .api-node > .boolean-row{
  display:block !important;
  width:auto !important;
  margin:0 !important;
}

.top-boolean-inline .boolean-control{
  display:inline-flex !important;
  width:auto !important;
  white-space:nowrap;
}

</style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
</head>

<body>

<div class="app">

<div class="toolbar">

  <div class="toolbar-row toolbar-row-primary">
    <div class="title-group">
      <h1>Generic API Tester</h1>
      <button id="readmeButton">README</button>
    </div>

    <div class="asset-group">
      <label for="assetSelect">API定義</label>
      <select id="assetSelect"></select>
      <button id="reloadAssets">定義再読込</button>
    </div>
  </div>

  <div class="toolbar-row toolbar-row-save">
    <input id="saveName" type="text" placeholder="保存名" style="max-width:180px">
    <button id="saveRequest">保存</button>

    <select id="savedRequests" style="max-width:220px"></select>
    <button id="loadRequest">読込</button>
    <button id="deleteRequest">削除</button>

    <button id="exportRequest">ファイル保存</button>
    <button id="importRequest">ファイル読込</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>

  <div class="toolbar-row toolbar-row-history">
    <select id="historySelect" style="max-width:320px">
      <option value="">実行履歴を選択</option>
    </select>
    <button id="loadHistory">履歴読込</button>
    <button id="deleteHistory">履歴1件削除</button>
    <button id="clearHistory">履歴全削除</button>
  </div>

</div>

<div class="two-column-layout">

<div class="left-column">

<section class="tile params-tile">
  <h2>パラメータ</h2>
  <div id="paramsArea"></div>
  <p id="paramsHelp" class="small">
    パラメータ構造は assets/api-assets.json の定義に従います。
  </p>
</section>

<details class="compact-detail" id="requestDetails" open>
  <summary>リクエスト</summary>
  <div class="compact-detail-content">
    <div class="row">
      <label>HTTPメソッド</label>
      <input id="method" type="text" readonly>
    </div>
    <div class="row">
      <label>送信形式</label>
      <input id="bodyType" type="text" readonly>
    </div>
    <div class="row">
      <label>パラメータ位置</label>
      <input id="paramLocation" type="text" readonly>
    </div>
    <div class="row">
      <label>アクセス先URL</label>
      <input id="url" type="text" readonly>
    </div>
  </div>
</details>

<details class="compact-detail" id="headerDetails">
  <summary>
    HTTPヘッダー
    <span id="headerCount" class="badge">0</span>
  </summary>
  <div class="compact-detail-content">
    <table class="header-table">
      <thead>
        <tr><th>キー</th><th>値</th></tr>
      </thead>
      <tbody id="headersBody"></tbody>
    </table>
  </div>
</details>


<details class="compact-detail" id="authDetails">
  <summary>認証</summary>
  <div class="compact-detail-content auth-panel">
    <div class="auth-row">
      <label>Bearer Token</label>
      <input id="authBearer" type="password" autocomplete="off">
    </div>
    <div class="auth-row">
      <label>API Key</label>
      <input id="authApiKey" type="password" autocomplete="off">
    </div>
  </div>
</details>

</div>

<div class="right-column">

<section class="tile send-tile">
  <h2>送信内容</h2>
  <textarea id="body" readonly></textarea>
  <div class="actions">
    <button id="preview">送信内容を生成</button>
    <button id="copyBody">送信内容をコピー</button>
    <button id="execute" class="primary">API実行</button>
    <button id="clear">結果クリア</button>
  </div>
  <h2 style="margin-top:12px">状態</h2>
  <div id="status" class="status">待機中</div>
</section>

<section class="tile response-tile">
  <h2>レスポンス</h2>
  <pre id="response">(未実行)</pre>
  <div class="actions">
    <button id="copyResponse">レスポンスをコピー</button>
  </div>
</section>

</div>

</div>
</div>

<div id="confirmModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" style="width:min(520px,94vw)">
    <div class="modal-header">
      <h2 id="confirmTitle">確認</h2>
    </div>

    <div class="modal-body">
      <p id="confirmMessage"></p>

      <div class="actions" style="justify-content:flex-end">
        <button id="confirmCancel">キャンセル</button>
        <button id="confirmOk" class="primary">OK</button>
      </div>
    </div>
  </div>
</div>

<div id="readmeModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="readmeTitle">
    <div class="modal-header">
      <h2 id="readmeTitle">README.md</h2>
      <button id="closeReadme">閉じる</button>
    </div>
    <div id="readmeContent" class="modal-body">
      読み込み中...
    </div>
  </div>
</div>

<script>
"use strict";

const ASSET_URL="./assets/api-assets.json";
const LAST_ASSET_KEY="genericApiTester.lastAssetKey";
let API_ASSETS={};
const $=id=>document.getElementById(id);

function parseSimple(value){
  const raw=String(value==null?"":value);
  const s=raw.trim();
  if(s==="") return "";
  if(s==="true") return true;
  if(s==="false") return false;
  if(s==="null") return null;
  if(/^[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?$/.test(s)){
    if(/^[-+]?0\d+$/.test(s)) return raw;
    return Number(s);
  }
  return raw;
}

function clone(v){ return JSON.parse(JSON.stringify(v)); }

function normalizeNode(node){
  const n=clone(node);
  if(!n.type){
    if(Array.isArray(n.children)) n.type="object";
    else if(Array.isArray(n.value)) n.type="array-legacy";
    else n.type="value";
  }
  return n;
}

function renderHeaders(headers){
  $("headersBody").innerHTML="";
  Object.entries(headers||{}).forEach(([k,v])=>{
    const tr=document.createElement("tr");
    const a=document.createElement("td"); a.textContent=k;
    const b=document.createElement("td"); b.textContent=v;
    tr.append(a,b); $("headersBody").appendChild(tr);
  });
  $("headerCount").textContent=Object.keys(headers||{}).length;
  $("headerDetails").open=false;
}

function encodeChoiceValue(value){
  if(typeof value==="undefined"){
    return JSON.stringify({kind:"undefined"});
  }

  return JSON.stringify({kind:"value",value:value});
}

function decodeChoiceValue(encoded){
  const data=JSON.parse(encoded);
  return data.kind==="undefined" ? undefined : data.value;
}

function sameChoiceValue(a,b){
  return JSON.stringify(a)===JSON.stringify(b);
}

function getInitialNodeValue(node){
  if(Object.prototype.hasOwnProperty.call(node,"default")){
    return {has:true,value:node.default};
  }

  if(Object.prototype.hasOwnProperty.call(node,"value")){
    return {has:true,value:node.value};
  }

  return {has:false,value:undefined};
}

function specialDisplayText(node){
  const special=String(node.special||"").toLowerCase();

  if(special==="uuid"){
    return "🔄 API実行時にUUIDを生成";
  }

  if(special==="datetime"){
    return "🔄 API実行時に現在日時を生成";
  }

  return "🔄 API実行時に自動生成";
}

function createValueControl(node){
  const row=document.createElement("div");
  row.className="param-leaf";

  const label=document.createElement("label");
  label.textContent=node.label || node.name || "値";

  if(node.required===true){
    const mark=document.createElement("span");
    mark.className="required-mark";
    mark.textContent="*";
    label.appendChild(mark);
  }

  const valueType=String(node.valueType||"").toLowerCase();
  const inputType=String(node.inputType||"").toLowerCase();

  if(valueType==="file"){
    const control=document.createElement("div");
    control.className="file-control";

    const input=document.createElement("input");
    input.type="file";
    input.className="node-value file-value";
    input.dataset.valueType="file";
    input.dataset.encoding=node.encoding||"none";

    if(node.accept){
      input.accept=node.accept;
    }

    if(node.multiple===true){
      input.multiple=true;
    }

    const meta=document.createElement("span");
    meta.className="file-meta";
    meta.textContent="未選択";

    input.addEventListener("change",()=>{
      const files=Array.from(input.files||[]);

      if(files.length===0){
        meta.textContent="未選択";
      }else if(files.length===1){
        const file=files[0];
        meta.textContent=
          file.name+" / "+
          (file.type||"application/octet-stream")+" / "+
          formatFileSize(file.size);
      }else{
        meta.textContent=files.length+" files";
      }
    });

    control.append(input,meta);
    row.append(label,control);
    return row;
  }

  if(valueType==="boolean"){
    row.classList.add("boolean-row");

    const control=document.createElement("div");
    control.className="boolean-control";
    control.tabIndex=0;

    const input=document.createElement("input");
    input.type="checkbox";
    input.className="node-value boolean-value";
    input.tabIndex=-1;

    const caption=document.createElement("span");
    caption.className="boolean-caption";
    caption.textContent=node.label || node.name || "値";

    const state=document.createElement("span");
    state.className="boolean-state";

    function applyBooleanState(nextState){
      input.dataset.boolState=nextState;

      if(nextState==="true"){
        input.indeterminate=false;
        input.checked=true;
        state.textContent="true";
      }else if(nextState==="false"){
        input.indeterminate=false;
        input.checked=false;
        state.textContent="false";
      }else{
        input.indeterminate=true;
        input.checked=false;
        state.textContent="未指定";
      }
    }

    const initial=getInitialNodeValue(node);

    if(initial.has && typeof initial.value==="boolean"){
      applyBooleanState(initial.value ? "true" : "false");
    }else{
      applyBooleanState("unset");
    }

    function nextBooleanState(){
      const current=input.dataset.boolState || "unset";

      if(current==="unset"){
        applyBooleanState("true");
      }else if(current==="true"){
        applyBooleanState("false");
      }else{
        applyBooleanState("unset");
      }
    }

    function handleBooleanToggle(e){
      e.preventDefault();
      e.stopPropagation();
      nextBooleanState();
    }

    control.addEventListener("click",handleBooleanToggle);
    control.addEventListener("keydown",e=>{
      if(e.key===" " || e.key==="Enter"){
        handleBooleanToggle(e);
      }
    });

    input._applyBooleanState=applyBooleanState;
    input._nextBooleanState=nextBooleanState;

    control.append(input,caption,state);
    row.append(control);
    return row;
  }

  if(!node.special && inputType==="select"){
    const select=document.createElement("select");
    select.className="node-value choice-select";
    select.dataset.valueType=valueType;
    select.dataset.inputType="select";

    const placeholder=document.createElement("option");
    placeholder.value="";
    placeholder.textContent="（未選択）";
    placeholder.dataset.unset="true";
    select.appendChild(placeholder);

    const initial=getInitialNodeValue(node);

    (node.options||[]).forEach(opt=>{
      const option=document.createElement("option");
      option.value=encodeChoiceValue(opt.value);
      option.textContent=opt.label==null ? String(opt.value) : String(opt.label);
      if(initial.has && sameChoiceValue(opt.value,initial.value)){
        option.selected=true;
      }
      select.appendChild(option);
    });

    if(!initial.has){
      select.value="";
    }

    row.append(label,select);
    return row;
  }

  if(!node.special && inputType==="radio"){
    const control=document.createElement("div");
    control.className="node-value radio-options";
    control.dataset.valueType=valueType;
    control.dataset.inputType="radio";

    const groupName="radio_"+Math.random().toString(36).slice(2);
    const initial=getInitialNodeValue(node);

    (node.options||[]).forEach(opt=>{
      const optionLabel=document.createElement("label");
      optionLabel.className="radio-option";

      const radio=document.createElement("input");
      radio.type="radio";
      radio.name=groupName;
      radio.value=encodeChoiceValue(opt.value);
      radio.dataset.choiceValue=radio.value;

      if(initial.has && sameChoiceValue(opt.value,initial.value)){
        radio.checked=true;
      }

      const caption=document.createElement("span");
      caption.textContent=opt.label==null ? String(opt.value) : String(opt.label);

      optionLabel.append(radio,caption);
      control.appendChild(optionLabel);
    });

    row.append(label,control);
    return row;
  }

  const controlWrap=document.createElement("div");
  controlWrap.className="special-value-control";

  const input=document.createElement("input");
  input.className="node-value";
  input.dataset.valueType=valueType;

  if(valueType==="number"){
    input.type="number";
    input.step="any";
  }else{
    input.type="text";
  }

  const initial=getInitialNodeValue(node);
  if(initial.has){
    input.value=initial.value==null?"":String(initial.value);
  }else{
    input.value="";
  }

  input.placeholder=node.placeholder||"";
  input.dataset.special=node.special||"";
  input.dataset.specialFormat=node.format||"";
  input.dataset.specialTimezone=node.timezone||"";
  input.dataset.specialRegenerate=node.regenerate||"ifEmpty";
  input.dataset.encoding=node.encoding||"none";

  if(node.special){
    input.readOnly=true;

    if((node.regenerate||"ifEmpty")==="eachRequest"){
      input.value=specialDisplayText(node);
      input.classList.add("special-auto-display");
      input._specialPendingValue=null;
    }else{
      input.placeholder=
        node.special==="uuid"
          ? "UUIDを自動生成"
          : node.special==="datetime"
            ? "日時を自動生成"
            : "自動生成";
    }

    const regenerate=document.createElement("button");
    regenerate.type="button";
    regenerate.textContent="再生成";
    regenerate.className="special-regenerate";

    regenerate.onclick=async()=>{
      try{
        regenerateSpecialInput(input,true);
        await updatePreviewFromCurrentValues();
      }catch(e){
        $("status").textContent=
          "特殊値生成エラー: "+e.message;
      }
    };

    controlWrap.append(input,regenerate);
  }else{
    controlWrap.appendChild(input);
  }

  row.append(label,controlWrap);
  return row;
}

function createNode(node, isArrayItem=false){
  node=normalizeNode(node);

  if(node.enabled===false){
    const hidden=document.createElement("div");
    hidden.dataset.disabled="1";
    return hidden;
  }

  const wrap=document.createElement("div");
  wrap.className="api-node";
  wrap.dataset.nodeType=node.type;
  wrap.dataset.nodeName=node.name||"";
  wrap.dataset.special=node.special||"";
  wrap.dataset.specialFormat=node.format||"";
  wrap.dataset.specialTimezone=node.timezone||"";
  wrap.dataset.specialRegenerate=node.regenerate||"ifEmpty";
  wrap.dataset.valueType=node.valueType||"";
  wrap.dataset.inputType=node.inputType||"";
  wrap.dataset.required=node.required===true?"true":"false";
  wrap.dataset.nullable=node.nullable===true?"true":"false";

  if(node.type==="value"){
    wrap.appendChild(createValueControl(node));
    return wrap;
  }

  if(node.type==="array-legacy"){
    const legacy={
      name:node.name,
      label:node.label,
      type:"array",
      item:{type:"value",value:""},
      initialItems:node.value.length
    };
    const w=createNode(legacy,isArrayItem);
    const items=w.querySelectorAll(":scope > .array-items > .array-item .node-value");
    node.value.forEach((v,i)=>{ if(items[i]) items[i].value=String(v); });
    return w;
  }

  const group=document.createElement("div");
  group.className="param-group";

  const title=document.createElement("div");
  title.className="param-group-title";
  title.textContent=node.label || node.name || (node.type==="array"?"配列":"オブジェクト");
  group.appendChild(title);

  if(node.type==="object"){
    if(node.layout==="inline") group.classList.add("inline-layout");
    const children=document.createElement("div");
    children.className="object-children";
    (node.children||[]).forEach(child=>{
      if(child.enabled!==false) children.appendChild(createNode(child));
    });
    group.appendChild(children);
    wrap.appendChild(group);
    return wrap;
  }

  if(node.type==="array"){
    wrap.dataset.itemTemplate=JSON.stringify(node.item||{type:"value",value:""});

    const items=document.createElement("div");
    items.className="array-items";
    group.appendChild(items);

    const actions=document.createElement("div");
    actions.className="actions";
    const add=document.createElement("button");
    add.type="button";
    add.textContent="＋追加";
    add.className="array-add";
    add.onclick=()=>addArrayItem(wrap);
    actions.appendChild(add);
    group.appendChild(actions);

    wrap.appendChild(group);

    const count=Math.max(0,Number(node.initialItems||0));
    for(let i=0;i<count;i++) addArrayItem(wrap);

    return wrap;
  }

  throw new Error("未対応type: "+node.type);
}

function addArrayItem(arrayNode){
  const items=arrayNode.querySelector(":scope > .param-group > .array-items");
  const template=JSON.parse(arrayNode.dataset.itemTemplate);
  const item=document.createElement("div");
  item.className="array-item param-group";

  const head=document.createElement("div");
  head.className="param-group-title";

  const title=document.createElement("span");
  title.className="array-item-title";

  const remove=document.createElement("button");
  remove.type="button";
  remove.textContent="削除";
  remove.style.float="right";
  remove.onclick=()=>{
    item.remove();
    renumberArray(arrayNode);
  };

  head.append(title,remove);
  item.appendChild(head);
  item.appendChild(createNode(template,true));
  items.appendChild(item);
  renumberArray(arrayNode);
}

function renumberArray(arrayNode){
  const items=arrayNode.querySelectorAll(":scope > .param-group > .array-items > .array-item");
  items.forEach((item,i)=>{
    item.querySelector(":scope > .param-group-title > .array-item-title").textContent="要素 "+(i+1);
  });
}

function renderParams(params){
  const area=$("paramsArea");
  area.innerHTML="";

  const enabledParams=(params||[]).filter(
    item=>item.enabled!==false
  );

  if(enabledParams.length===0){
    area.classList.remove("has-params");
    area.classList.add("no-params");

    const none=document.createElement("div");
    none.className="small";
    none.textContent="（なし）";
    area.appendChild(none);

    $("paramsHelp").style.display="none";
    return;
  }

  area.classList.remove("no-params");
  area.classList.add("has-params");
  $("paramsHelp").style.display="";

  let booleanGroup=null;

  function flushBooleanGroup(){
    if(
      booleanGroup &&
      booleanGroup.children.length>0
    ){
      area.appendChild(booleanGroup);
    }

    booleanGroup=null;
  }

  enabledParams.forEach(p=>{
    const normalized=normalizeNode(p);

    const isTopBoolean=
      normalized.type==="value" &&
      String(normalized.valueType||"").toLowerCase()==="boolean";

    if(isTopBoolean){
      if(!booleanGroup){
        booleanGroup=document.createElement("div");
        booleanGroup.className="top-boolean-inline";
      }

      booleanGroup.appendChild(
        createNode(p)
      );

      return;
    }

    flushBooleanGroup();

    area.appendChild(
      createNode(p)
    );
  });

  flushBooleanGroup();
}

function resolveMissingValue(required,nullable,name){
  if(required){
    if(nullable){
      return {present:true,value:null};
    }

    throw new Error("「"+name+"」は必須です。");
  }

  return {present:false,value:null};
}

function getSpecialRawValue(input,options={}){
  const special=(input.dataset.special||"").toLowerCase();
  if(!special) return null;

  const regenerate=(input.dataset.specialRegenerate||"ifEmpty").toLowerCase();

  if(regenerate==="eachrequest"){
    if(input._specialPendingValue==null){
      if(options.generateSpecial===false){
        return "";
      }
      input._specialPendingValue=generateSpecialInputValue(input);
    }
    return String(input._specialPendingValue);
  }

  if(regenerate==="manual"){
    return input.value;
  }

  if(input.value.trim()==="" && options.generateSpecial!==false){
    regenerateSpecialInput(input,false);
  }

  return input.value;
}

function nodeValue(node,options={}){
  const type=node.dataset.nodeType;

  if(type==="value"){
    const input=node.querySelector(":scope .node-value");
    const valueType=(node.dataset.valueType||"").toLowerCase();
    const inputType=(node.dataset.inputType||"").toLowerCase();
    const required=node.dataset.required==="true";
    const nullable=node.dataset.nullable==="true";
    const name=node.dataset.nodeName||"パラメータ";

    if(valueType==="file"){
      const files=Array.from(input.files||[]);
      if(files.length===0){
        return resolveMissingValue(required,nullable,name);
      }
      return {present:true,value:files};
    }

    if(valueType==="boolean"){
      const boolState=input.dataset.boolState || "unset";
      if(boolState==="unset"){
        return resolveMissingValue(required,nullable,name);
      }
      return {present:true,value:boolState==="true"};
    }

    if(inputType==="select"){
      const selected=input.selectedOptions[0];
      if(!selected || selected.dataset.unset==="true"){
        return resolveMissingValue(required,nullable,name);
      }
      return {present:true,value:decodeChoiceValue(selected.value)};
    }

    if(inputType==="radio"){
      const checked=input.querySelector('input[type="radio"]:checked');
      if(!checked){
        return resolveMissingValue(required,nullable,name);
      }
      return {present:true,value:decodeChoiceValue(checked.value)};
    }

    if(
      input.dataset.special &&
      (input.dataset.specialRegenerate||"ifEmpty").toLowerCase()==="eachrequest" &&
      options.generateSpecial===false
    ){
      // 保存データにはリクエストごとの一時生成値を固定値として残さない。
      return {present:false,value:null};
    }

    const raw=input.dataset.special
      ? getSpecialRawValue(input,options)
      : input.value;

    if(String(raw).trim()===""){
      return resolveMissingValue(required,nullable,name);
    }

    if(valueType==="string"){
      const encoding=(input.dataset.encoding||"none").toLowerCase();

      if(encoding==="quoted-printable"){
        return {present:true,value:quotedPrintableEncodeText(raw)};
      }

      if(encoding==="base64"){
        const bytes=new TextEncoder().encode(raw);
        let binary="";
        for(const b of bytes){
          binary+=String.fromCharCode(b);
        }
        return {present:true,value:btoa(binary)};
      }

      return {present:true,value:String(raw)};
    }

    if(valueType==="number"){
      const n=Number(raw);
      if(!Number.isFinite(n)){
        throw new Error("「"+name+"」には数値を入力してください。");
      }
      return {present:true,value:n};
    }

    return {present:true,value:parseSimple(raw)};
  }

  if(type==="object"){
    const obj={};
    const children=node.querySelector(":scope > .param-group > .object-children");
    for(const child of children.children){
      if(!child.classList.contains("api-node")) continue;
      const r=nodeValue(child,options);
      const name=child.dataset.nodeName;
      if(r.present && name) obj[name]=r.value;
    }
    return {present:Object.keys(obj).length>0,value:obj};
  }

  if(type==="array"){
    const arr=[];
    const items=node.querySelectorAll(":scope > .param-group > .array-items > .array-item");
    for(const item of items){
      const child=item.querySelector(":scope > .api-node");
      const r=nodeValue(child,options);
      if(r.present) arr.push(r.value);
    }

    const required=node.dataset.required==="true";
    const nullable=node.dataset.nullable==="true";
    const name=node.dataset.nodeName||"パラメータ";

    if(arr.length===0 && required && nullable && items.length===0){
      return {present:true,value:[]};
    }

    if(arr.length===0 && required && !nullable && items.length===0){
      return {present:true,value:[]};
    }

    return {present:arr.length>0,value:arr};
  }

  return {present:false,value:null};
}


function generateUuid(){
  if(
    window.crypto &&
    typeof window.crypto.randomUUID==="function"
  ){
    return window.crypto.randomUUID();
  }

  const bytes=new Uint8Array(16);

  if(window.crypto && window.crypto.getRandomValues){
    window.crypto.getRandomValues(bytes);
  }else{
    for(let i=0;i<bytes.length;i++){
      bytes[i]=Math.floor(Math.random()*256);
    }
  }

  bytes[6]=(bytes[6]&0x0f)|0x40;
  bytes[8]=(bytes[8]&0x3f)|0x80;

  const hex=Array.from(
    bytes,
    b=>b.toString(16).padStart(2,"0")
  );

  return [
    hex.slice(0,4).join(""),
    hex.slice(4,6).join(""),
    hex.slice(6,8).join(""),
    hex.slice(8,10).join(""),
    hex.slice(10,16).join("")
  ].join("-");
}

function formatDateTime(date,format,timezone){
  const utc=String(timezone||"local").toLowerCase()==="utc";

  const year=utc ? date.getUTCFullYear() : date.getFullYear();
  const month=(utc ? date.getUTCMonth() : date.getMonth())+1;
  const day=utc ? date.getUTCDate() : date.getDate();
  const hour=utc ? date.getUTCHours() : date.getHours();
  const minute=utc ? date.getUTCMinutes() : date.getMinutes();
  const second=utc ? date.getUTCSeconds() : date.getSeconds();
  const ms=utc ? date.getUTCMilliseconds() : date.getMilliseconds();

  const values={
    yyyy:String(year).padStart(4,"0"),
    MM:String(month).padStart(2,"0"),
    dd:String(day).padStart(2,"0"),
    HH:String(hour).padStart(2,"0"),
    mm:String(minute).padStart(2,"0"),
    ss:String(second).padStart(2,"0"),
    SSS:String(ms).padStart(3,"0")
  };

  let result=format || "yyyy-MM-dd HH:mm:ss";

  // Single quotes are literal delimiters, e.g. 'T' and 'Z'.
  result=result.replace(/'([^']*)'/g,"$1");

  return result.replace(
    /yyyy|SSS|MM|dd|HH|mm|ss/g,
    token=>values[token]
  );
}

function generateSpecialValue(node){
  const special=(node.dataset.special||"").toLowerCase();

  if(!special){
    return null;
  }

  if(special==="uuid"){
    let value=generateUuid();
    const format=(node.dataset.specialFormat||"default").toLowerCase();

    if(format==="compact"){
      value=value.replace(/-/g,"");
    }else if(format!=="default" && format!==""){
      throw new Error(
        "未対応のUUID formatです: "+format
      );
    }

    return value;
  }

  if(special==="datetime"){
    const timezone=(node.dataset.specialTimezone||"local").toLowerCase();

    if(timezone!=="local" && timezone!=="utc"){
      throw new Error(
        "未対応のdatetime timezoneです: "+timezone
      );
    }

    return formatDateTime(
      new Date(),
      node.dataset.specialFormat||"yyyy-MM-dd HH:mm:ss",
      timezone
    );
  }

  throw new Error(
    "未対応のspecialです: "+special
  );
}

function applySpecialValues(){
  const nodes=$("paramsArea").querySelectorAll(
    '.api-node[data-node-type="value"][data-special]:not([data-special=""])'
  );

  for(const node of nodes){
    const value=generateSpecialValue(node);
    const input=node.querySelector(":scope .node-value");

    if(input && value!==null){
      input.value=value;
    }
  }
}

    const format=
      (input.dataset.specialFormat||"default")
        .toLowerCase();

    if(format==="compact"){
      value=value.replace(/-/g,"");

    );

  );

function regenerateSpecialInput(input,force=false){
  if(!input || !input.dataset.special){
    return;
  }

  const regenerate=(input.dataset.specialRegenerate||"ifEmpty").toLowerCase();
  const value=generateSpecialInputValue(input);

  if(regenerate==="eachrequest"){
    if(force || input._specialPendingValue==null){
      input._specialPendingValue=value;
    }
    return;
  }

  input.value=value;
}

function ensureSpecialValues(options={}){
  const inputs=$("paramsArea").querySelectorAll(
    '.node-value[data-special]:not([data-special=""])'
  );

  for(const input of inputs){
    const regenerate=(input.dataset.specialRegenerate||"ifEmpty").toLowerCase();

    if(regenerate==="eachrequest"){
      if(options.regenerateEachRequest===true || input._specialPendingValue==null){
        regenerateSpecialInput(input,true);
      }
      continue;
    }

    if(regenerate==="manual"){
      continue;
    }

    if(input.value.trim()===""){
      regenerateSpecialInput(input,false);
    }
  }
}

function clearEachRequestSpecialValues(){
  const inputs=$("paramsArea").querySelectorAll(
    '.node-value[data-special]:not([data-special=""])'
  );

  for(const input of inputs){
    if((input.dataset.specialRegenerate||"ifEmpty").toLowerCase()==="eachrequest"){
      input._specialPendingValue=null;
    }
  }
}


async function updatePreviewFromCurrentValues(){
  const p=await prepareRequest();

  $("url").value=p.url;

  $("body").value=p.bodyPreview || "";
